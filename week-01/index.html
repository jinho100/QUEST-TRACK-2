<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응 속도 테스트</title>
<style>
  :root {
    --bg: #1e2433;
    --panel: #2a3145;
    --text: #f2f4f8;
    --muted: #a9b1c6;
    --wait: #d64545;
    --go: #2fb86b;
    --fail: #e0a030;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 16px;
  }
  h1 { margin: 8px 0 0; font-size: 1.6rem; }
  .help {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 18px;
    color: var(--muted);
    line-height: 1.6;
  }
  .help ol { margin: 4px 0; padding-left: 20px; }
  .help b { color: var(--text); }
  #stage {
    width: 100%;
    max-width: 640px;
    height: 300px;
    border-radius: 16px;
    background: var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    padding: 16px;
    transition: background 0.05s;
  }
  #stage.wait { background: var(--wait); }
  #stage.go { background: var(--go); }
  #stage.fail { background: var(--fail); color: #1e2433; }
  #big { font-size: 2.4rem; font-weight: 700; }
  #small { font-size: 1.1rem; margin-top: 8px; opacity: 0.9; }
  .stats {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat .label { font-size: 0.85rem; color: var(--muted); }
  .stat .value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
  #rounds {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dot {
    min-width: 64px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
  .dot.done { background: var(--go); color: #fff; }
  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  button:hover { color: var(--text); border-color: var(--text); }
  @media (max-width: 480px) {
    #stage { height: 240px; }
    #big { font-size: 1.9rem; }
    .stat .value { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <h1>⚡ 반응 속도 테스트</h1>

  <div class="help">
    <b>사용법</b>
    <ol>
      <li>아래 파란 칸을 클릭(또는 스페이스바)하면 시작해요.</li>
      <li>칸이 <b style="color:var(--wait)">빨간색</b>이면 기다리세요.</li>
      <li><b style="color:var(--go)">초록색</b>으로 바뀌는 순간 최대한 빨리 클릭!</li>
      <li>초록색 전에 누르면 <b style="color:var(--fail)">실패</b> — 그 판은 다시 해요.</li>
      <li>5번 성공하면 평균 기록이 나와요. 최고 기록은 저장돼요.</li>
    </ol>
  </div>

  <div id="stage" class="ready">
    <div id="big">클릭해서 시작</div>
    <div id="small">5번 재서 평균을 구해요</div>
  </div>

  <div id="rounds"></div>

  <div class="stats">
    <div class="stat"><div class="label">이번 평균</div><div class="value" id="avg">-</div></div>
    <div class="stat"><div class="label">최고 평균 (5회)</div><div class="value" id="bestAvg">-</div></div>
    <div class="stat"><div class="label">최고 한 번</div><div class="value" id="bestOne">-</div></div>
  </div>

  <button id="reset">최고 기록 지우기</button>

<script>
  const TOTAL = 5;
  const stage = document.getElementById('stage');
  const big = document.getElementById('big');
  const small = document.getElementById('small');
  const roundsEl = document.getElementById('rounds');

  // 상태: ready(시작 전) → wait(빨강) → go(초록) → result / fail → ... → finished
  let state = 'ready';
  let times = [];
  let timer = null;
  let goAt = 0;

  // 최고 기록 저장 (브라우저에 저장, 막혀 있어도 게임은 돌아가게)
  function load(key) {
    try { const v = localStorage.getItem(key); return v ? Number(v) : null; }
    catch (e) { return null; }
  }
  function save(key, v) {
    try { localStorage.setItem(key, String(v)); } catch (e) {}
  }
  let bestAvg = load('rt-best-avg');
  let bestOne = load('rt-best-one');

  function ms(v) { return v == null ? '-' : Math.round(v) + 'ms'; }

  function drawStats() {
    const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : null;
    document.getElementById('avg').textContent = ms(avg);
    document.getElementById('bestAvg').textContent = ms(bestAvg);
    document.getElementById('bestOne').textContent = ms(bestOne);
    roundsEl.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (times[i] != null ? ' done' : '');
      d.textContent = times[i] != null ? ms(times[i]) : (i + 1) + '회';
      roundsEl.appendChild(d);
    }
  }

  function show(cls, bigText, smallText) {
    stage.className = cls;
    big.textContent = bigText;
    small.textContent = smallText;
  }

  function startRound() {
    state = 'wait';
    show('wait', '기다리세요…', '초록색이 되면 클릭!');
    const delay = 1500 + Math.random() * 3000; // 1.5 ~ 4.5초 사이 무작위
    timer = setTimeout(() => {
      state = 'go';
      goAt = performance.now();
      show('go', '지금 클릭!', '');
    }, delay);
  }

  function finish() {
    state = 'finished';
    const avg = times.reduce((a, b) => a + b, 0) / TOTAL;
    let msg = '다시 하려면 클릭';
    if (bestAvg == null || avg < bestAvg) {
      bestAvg = avg;
      save('rt-best-avg', avg);
      msg = '🎉 최고 평균 기록 갱신! · 다시 하려면 클릭';
    }
    show('ready', '평균 ' + ms(avg), msg);
    drawStats();
  }

  function press() {
    if (state === 'ready' || state === 'finished') {
      if (state === 'finished') times = [];
      drawStats();
      startRound();
    } else if (state === 'wait') {
      clearTimeout(timer);
      state = 'fail';
      show('fail', '너무 빨라요! 실패', '이 판은 기록되지 않아요 · 클릭해서 다시');
    } else if (state === 'go') {
      const t = performance.now() - goAt;
      times.push(t);
      if (bestOne == null || t < bestOne) {
        bestOne = t;
        save('rt-best-one', t);
      }
      drawStats();
      if (times.length >= TOTAL) {
        finish();
      } else {
        state = 'result';
        show('ready', ms(t), times.length + ' / ' + TOTAL + '회 · 클릭해서 다음');
      }
    } else if (state === 'result' || state === 'fail') {
      startRound();
    }
  }

  // 마우스·터치 모두 누르는 순간 바로 반응하도록 pointerdown 사용
  stage.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });

  document.getElementById('reset').addEventListener('click', () => {
    bestAvg = null; bestOne = null;
    try { localStorage.removeItem('rt-best-avg'); localStorage.removeItem('rt-best-one'); } catch (e) {}
    drawStats();
  });

  drawStats();
</script>
</body>
</html>
